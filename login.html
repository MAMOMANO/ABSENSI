<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Absensi</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
     <link rel="stylesheet" href="./src/output.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      
      * {
        font-family: 'Inter', sans-serif;
      }
      
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        position: relative;
        overflow: hidden;
      }
      
      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: 
          radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 40% 40%, rgba(120, 119, 198, 0.2) 0%, transparent 50%);
        animation: float 20s ease-in-out infinite;
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(180deg); }
      }
      
      .login-container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 
          0 25px 50px -12px rgba(0, 0, 0, 0.25),
          0 0 0 1px rgba(255, 255, 255, 0.1);
        position: relative;
        z-index: 10;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      
      .login-container:hover {
        transform: translateY(-5px);
        box-shadow: 
          0 35px 60px -12px rgba(0, 0, 0, 0.3),
          0 0 0 1px rgba(255, 255, 255, 0.2);
      }
      
      .input-group {
        position: relative;
        margin-bottom: 1.5rem;
      }
      
      .input-field {
        width: 100%;
        padding: 1rem 1.25rem;
        border: 2px solid rgba(226, 232, 240, 0.8);
        border-radius: 12px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
      }
      
      .input-field:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        background: rgba(255, 255, 255, 1);
        transform: translateY(-2px);
      }
      
      .input-field::placeholder {
        color: #94a3b8;
        font-weight: 400;
      }
      
      .login-button {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 12px;
        color: white;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }
      
      .login-button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
      }
      
      .login-button:active {
        transform: translateY(0);
      }
      
      .login-button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
      }
      
      .login-button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s;
      }
      
      .login-button:hover::before {
        left: 100%;
      }
      
      .title {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 700;
        font-size: 2rem;
        margin-bottom: 2rem;
        text-align: center;
        position: relative;
      }
      
      .title::after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 3px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 2px;
      }
      
      .error-message {
        color: #ef4444;
        font-weight: 500;
        text-align: center;
        margin-top: 1rem;
        padding: 0.75rem;
        background: rgba(254, 226, 226, 0.8);
        border-radius: 8px;
        border-left: 4px solid #ef4444;
        backdrop-filter: blur(10px);
      }
      
      .loading {
        text-align: center;
        margin-top: 1rem;
        color: #667eea;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      
      .loading-spinner {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(102, 126, 234, 0.3);
        border-top: 2px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .form-container {
        position: relative;
        z-index: 1;
      }
      
      @media (max-width: 480px) {
        .login-container {
          margin: 1rem;
          padding: 1.5rem;
        }
        
        .title {
          font-size: 1.75rem;
        }
      }
    </style>
  </head>
  <body class="h-screen flex items-center justify-center">
    <div class="login-container p-8 rounded-2xl w-full max-w-md">
      <h2 class="title">Login Karyawan</h2>
      
      <form id="loginForm" class="form-container space-y-4">
        <div class="input-group">
          <input
            type="text"
            id="username"
            placeholder="Username"
            required
            class="input-field"
          />
        </div>
        
        <div class="input-group">
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
            class="input-field"
          />
        </div>
        
        <button
          type="submit"
          id="loginButton"
          class="login-button"
        >
          Login
        </button>
      </form>
      
      <p id="loginMessage" class="error-message" style="display: none;"></p>
      
      <div id="loading" class="loading hidden">
        <div class="loading-spinner"></div>
        <span>Memuat...</span>
      </div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          const loginButton = document.getElementById("loginButton");
          const loginMessage = document.getElementById("loginMessage");
          const loading = document.getElementById("loading");

          loginButton.disabled = true;
          loginMessage.style.display = "none";
          loading.classList.remove("hidden");

          try {
            const response = await fetch("http://localhost:4000/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            });

            const data = await response.json();
            console.log("Respons API login:", data); // Debug respons

            if (!response.ok) {
              throw new Error(
                data.message || `Kesalahan server: ${response.status}`
              );
            }

            if (data.success && data.accessToken) {
              localStorage.setItem("token", data.accessToken);
              localStorage.setItem("user", JSON.stringify(data.user));
              console.log("Token disimpan:", data.accessToken); // Debug token
              window.location.href = "index.html";
            } else {
              throw new Error(
                data.message || "Token tidak diterima atau login gagal."
              );
            }
          } catch (err) {
            console.error("Login error:", err);
            loginMessage.innerText = `❌ ${
              err.message || "Terjadi kesalahan koneksi."
            }`;
            loginMessage.style.display = "block";
          } finally {
            loginButton.disabled = false;
            loading.classList.add("hidden");
          }
        });
    </script>
  </body>
</html>
